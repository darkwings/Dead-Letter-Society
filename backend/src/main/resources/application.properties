# Application
quarkus.application.name=dead-letter-society

# DataSource — Dev Services active in dev/test, overridden in prod
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USER:dls}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dls}

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# Hibernate
quarkus.hibernate-orm.database.generation=none

# Dev Services auto-enabled in dev/test when no datasource URL is configured (OrbStack/Testcontainers)
# Image override (optional): %dev.quarkus.datasource.devservices.image-name=postgres:16-alpine

# Kafka Dev Services auto-enabled in dev/test
# Image override (optional): %dev.quarkus.kafka.devservices.image-name=confluentinc/cp-kafka:7.8.0

# Encryption key (REQUIRED in prod, insecure default for dev only)
%dev.dls.encryption.key=${DLS_ENCRYPTION_KEY:dev-only-insecure-key-32chars!!}
%test.dls.encryption.key=${DLS_ENCRYPTION_KEY:test-only-insecure-key-32chars!}
%prod.dls.encryption.key=${DLS_ENCRYPTION_KEY}

# HTTP
quarkus.http.port=8080
%prod.quarkus.http.ssl-port=8443

# OIDC (disabled by default)
quarkus.oidc.enabled=${QUARKUS_OIDC_ENABLED:false}
quarkus.oidc.auth-server-url=${QUARKUS_OIDC_AUTH_SERVER_URL:}
quarkus.oidc.client-id=${QUARKUS_OIDC_CLIENT_ID:dls}
quarkus.oidc.application-type=service

# ADMIN claim mapping for OIDC
dls.oidc.admin-claim-name=${DLS_OIDC_ADMIN_CLAIM:roles}
dls.oidc.admin-claim-value=${DLS_OIDC_ADMIN_VALUE:dls-admin}
