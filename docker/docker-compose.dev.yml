version: '3.9'
# Local dev stack with Redpanda (Kafka + Schema Registry in one container).
# Usage:
#   docker compose -f docker/docker-compose.dev.yml up -d
#   ./gradlew quarkusDev -Dquarkus.devservices.enabled=false
#
# Unit/IT tests still use Quarkus Dev Services (Testcontainers) — no changes needed.

services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: dls
      POSTGRES_USER: dls
      POSTGRES_PASSWORD: dls
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dls"]
      interval: 5s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --kafka-addr=0.0.0.0:9092
      - --advertise-kafka-addr=localhost:9092
      - --schema-registry-addr=0.0.0.0:8081
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=localhost:8082
    ports:
      - "9092:9092"
      - "8081:8081"
      - "8082:8082"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info --brokers localhost:9092 2>/dev/null | grep -q 'CONTROLLER'"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
