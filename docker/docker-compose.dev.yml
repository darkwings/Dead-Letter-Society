# Local dev stack: PostgreSQL + Confluent Kafka + Schema Registry + AKHQ (no auth, PLAINTEXT).
# Usage:
#   docker compose -f docker/docker-compose.dev.yml up -d
#   cd backend && ./gradlew quarkusDev -Dquarkus.devservices.enabled=false
#
# AKHQ UI: http://localhost:8085
#
# Unit/IT tests still use Quarkus Dev Services (Testcontainers) — no changes needed here.

name: dls-dev

networks:
  dls-dev:

services:

  db:
    image: postgres:16-alpine
    container_name: dls-dev-db
    networks: [dls-dev]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: dls
      POSTGRES_USER: dls
      POSTGRES_PASSWORD: dls
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dls"]
      interval: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: dls-dev-kafka
    networks: [dls-dev]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

      # Two listeners: EXTERNAL for host access, INTERNAL for Docker-network services (SR)
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: dls-dev-schema-registry
    networks: [dls-dev]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: PLAINTEXT

  akhq:
    image: tchiotludo/akhq:0.25.0
    container_name: dls-dev-akhq
    networks: [dls-dev]
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_started
    ports:
      - "8085:8080"
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            dls-dev:
              properties:
                bootstrap.servers: "kafka:29092"
              schema-registry:
                url: "http://schema-registry:8081"

volumes:
  db-data:

